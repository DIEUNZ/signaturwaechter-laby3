name: GitHub Release

# Jeder Push auf master baut die Jar, lässt die Tests laufen und veröffentlicht sie als GitHub Release.
# Version: <Basis aus release-base.txt>.<X>, X zählt bei jedem Release hoch (1.0.1, 1.0.2, ...).

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: github-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Version bestimmen
        run: |
          BASE="$(tr -d '[:space:]' < release-base.txt)"
          LAST="$(git tag -l "v${BASE}.*" | sed "s/^v${BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)"
          NEXT=$(( ${LAST:-0} + 1 ))
          echo "VERSION=${BASE}.${NEXT}" >> "$GITHUB_ENV"
      - name: Bauen und testen
        shell: pwsh
        run: ./build.ps1
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" build/ah-fake-warner-lm3.jar \
            --target "$GITHUB_SHA" \
            --title "AH-Fake-Warner für LabyMod 3 – ${VERSION}" \
            --generate-notes \
            --notes "Nur für LabyMod 3 mit Minecraft 1.8.9 (für LabyMod 4 gibt es https://github.com/DIEUNZ/signaturwaechter). Jar in den Ordner .minecraft/LabyMod/addons-1.8 legen und das Spiel neu starten. Beim Update die alte ah-fake-warner-lm3.jar überschreiben (Spiel vorher schließen). Support: https://discord.gg/sCex8JNTGS"
